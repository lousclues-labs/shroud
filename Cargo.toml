[package]
name = "vpn-shroud"
version = "2.5.6"
edition = "2021"
authors = ["Louis Nelson Jr. (loujr) <https://lousclues.com>"]
description = "A provider-agnostic VPN connection manager for Linux with kill switch, auto-reconnect, and system tray integration"
readme = "README.md"
license = "GPL-3.0-or-later"
repository = "https://github.com/lousclues-labs/shroud"
homepage = "https://vpnshroud.org"
documentation = "https://vpnshroud.org/docs"
keywords = ["vpn", "openvpn", "networkmanager", "linux", "tray"]
categories = ["command-line-utilities", "network-programming"]
rust-version = "1.87"

[lib]
name = "shroud"
path = "src/lib.rs"

[[bin]]
name = "shroud"
path = "src/main.rs"

# Arch Linux Setup Instructions:
# Install required system packages:
#   sudo pacman -S networkmanager networkmanager-openvpn nftables iptables sudo
#
# The application uses:
# - NetworkManager for VPN connection management
# - nmcli for NetworkManager interface
# - nftables/iptables for kill switch firewall rules
# - D-Bus for StatusNotifierItem (SNI) tray support on KDE Plasma

[dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "signal"] }
async-trait = "0.1"

# Native KDE/SNI tray support
ksni = { version = "0.3", features = ["blocking"] }

# Structured logging with RUST_LOG environment variable support
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "ansi"] }

# Desktop notifications via D-Bus
notify-rust = { version = "4", default-features = false, features = ["dbus"] }

# D-Bus for NetworkManager event subscription
zbus = "5"

# Async stream utilities for D-Bus message stream
futures-lite = "2"

# Ctrl-C handler for graceful shutdown
ctrlc = "3.4"

# Lazy static for one-time icon generation

# Serialization for config file
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"

# Home directory and filesystem
dirs = "5"
walkdir = "2"

# Low-level system calls (flock for instance lock)
libc = "0.2"
thiserror = "1"
ureq = "3"

# Random number generation (for jitter in linear backoff)
rand = "0.9"

# Scope-based cleanup for reconnect guard
scopeguard = "1"

# ============================================================================
# Build profiles
# ============================================================================

# Release profile tuned for daemon workload:
#   - opt-level = 3 favors hot-path throughput over size. Shroud runs as a
#     long-lived process; size-optimization ("s") was leaving cycles on the
#     table in the supervisor event loop and the NM polling path.
#   - lto = true (fat LTO) + codegen-units = 1 maximize cross-crate inlining.
#   - strip = true (symbols) keeps the on-disk binary lean; full debug info
#     lives in the `release-with-debug` profile below for profiling.
#   - panic = "unwind" preserves Drop ordering for the killswitch firewall
#     scopeguard. Switching to "abort" would break our cleanup contract.
[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
panic = "unwind"

# Optimize dependencies at the same level as the crate. Default is already 3,
# but pin it so a future profile-wide bump doesn't silently regress deps.
[profile.release.package."*"]
opt-level = 3

# Profile for capturing perf / flamegraph / valgrind data against a near-release
# binary. Inherits everything from release except strip + debug, so symbols are
# preserved. Build with: `cargo build --profile release-with-debug`
[profile.release-with-debug]
inherits = "release"
strip = false
debug = 2

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
tokio-test = "0.4"

# ============================================================================
# Test Targets
# ============================================================================

# Integration tests - module interactions with mocks
[[test]]
name = "integration"
path = "tests/integration/mod.rs"

# Security tests - privileged tests for security verification
[[test]]
name = "security"
path = "tests/security/mod.rs"

# Regression tests - verify fixes remain in codebase
[[test]]
name = "regression"
path = "tests/regression.rs"
